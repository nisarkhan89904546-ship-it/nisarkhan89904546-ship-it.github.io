<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisar Ahmad - Portfolio Web Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI' 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 850px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 auto 25px auto;
            gap: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .left-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .left-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #10b981;
            flex-shrink: 0;
        }

        .intro-text h1 {
            font-size: 1.5rem;
            color: #fff;
        }

        .intro-text p {
            font-size: 0.95rem;
            color: #10b981;
            font-weight: 600;
            margin-top: 5px;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-status, .btn-custom, .btn-contact {
            background: #2563eb;
            color: black;
            border: 1px solid #475569;
        }

        .btn-status:hover, .btn-custom:hover, .btn-contact:hover {
            background-color: #10b981;
            transform: translateY(-2px);
        }

        .display-box {
            background: #0f172a;
            border-left: 4px solid #10b981;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
            animation: fadeIn 0.5s ease;
            margin-top: 10px;
        }

        .code-box {
            font-family: 'Courier New',  Courier, monospace;
            color: blue;
            border-left-color: #38bdf8;
        }

        .rigth-pic-container {
            flex-shrink: 0;
            text-align: center;
        }

        .rigth-pic {
            width: 220px;
            height: 100%;
            height: auto;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 1px solid #475569;
        }

        .fiverr-text {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #10b981;
            font-weight: bold;
            text-align: center;
        }

        @keyframes fadeIn {
            form { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .project-card {
            background: #1e293b;
            color: #f8fafc;
            padding: 25px;
            margin: 25px auto;
            max-width: 850px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            text-align: center;
            }

            .project-card h2 {
                margin-bottom: 15px;
                font-size: 1.4rem;
                color: #fff;
            }

            .project-card video {
                width: 100%;
                height: auto;
                max-width: 450px;
                border-radius: 10px;
                margin-bottom: 20px;
                background: #000;
            }

                .btn-preview,
                .btn-code {
                    background-color: blue;
                    color: black;
                    border: none;
                    padding: 10px 20px;
                    font-size: 14px;
                    font-weight: bold;
                    border-radius: 6px;
                    cursor: pointer;
                    margin: 5px;
                    transition: background-color 0.3s ease;
                }

                .btn-preview:hover,
                .btn-code:hover {
                    background-color: #10b981;
                }

                footer {
                    text-align: center;
                    margin-top: 30px;
                    color: #94a3b8;
                    font-size: 0.95rem;
                    padding-bottom: 20px;
                }

                @media(max-width:768px) {
                    .profile-card { 
                        flex-direction: column;
                        padding: 20px;
                        text-align: center;
                    }
                    .profile-header{
                        flex-direction: column;
                        text-align: center;
                    }
                    .rigth-pic-container{
                        width: 100%;
                        margin-top: 10px;
                    }
                    .rigth-pic{
                        width: 180px;
                    }
                    .btn-container {
                        justify-content: center;
                    }
            }

            @media(max-width: 480px) {
                body {
                    padding: 8px;
                }
                .profile-card {
                    padding: 15px;
                    border-radius: 12px;
                }
                .intro-text h1 {
                    font-size: 1.2rem;
                }
                .intro-text p {
                    font-size: 0.85rem;
                }
                .left-pic {
                    width: 65px;
                    height: 65px;
                }
                .rigth-pic {
                    width: 140px;
                }
                .btn-container {
                    flex-direction: column;
                    width: 100%;
                }
                .btn {
                    width: 100%;
                    padding: 10px;
                    font-size: 0.85rem;
                }
                .profile-card {
                    padding: 15px 10px;
                    margin: 15px 0;
                }
                .profile-card h2 {
                    font-size: 1.1rem;
                }
                .btn-preview, .btn-code {
                    width: 100%;
                    display: block;
                    margin: 5px 0;
                }
            }

            footer {
                text-align: center;
                margin-top: 40px;
                padding: 20px 10px;
                color: #94a3b8;
                font-size: 0.95rem;
            }

            .footer-social {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
                gap: 12px;
                margin-bottom: 18px;
            }

            .social-btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 9px 16px;
                border-radius: 8px;
                text-decoration: none;
                color: #ffffff;
                font-size: 0.9rem;
                font-weight: 600;
                transition: transform 0.3s ease;
            }

            .social-btn:hover {
                transform: translateY(-3px);
                opacity: 0.9;
            }

            .facebook { background-color: #1877F2; }
            .whatsapp { background-color: #25D366; }
            .youtube { background-color: #FF0000; }
            .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            }

            @media (max-width: 480px) {
                .footer-social {
                    gap: 8px;
                }
                .social-btn {
                    flex:  1 1 44%;
                    justify-content: center;
                    font-size: 0.85rem;
                    padding: 9px 10px;
                }
            }

        </style>
</head>
